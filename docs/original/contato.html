<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - SportZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <a class="logo" href="index.html">SportZone</a>

  <div class="search">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input type="search" id="siteSearch" placeholder="Pesquisar" autocomplete="off">
  </div>

  <nav class="nav">
    <a class="" href="index.html">Home</a>
    <a class="" href="produtos.html">Produtos</a>
    <a class="" href="lancamentos.html">Lançamentos</a>
    <a class="" href="promocoes.html">Promoções</a>
    <a class="active" href="contato.html">Contate-nos</a>
  </nav>
</header>


<main>
  <div class="cart-area"><a class="cart-icon" href="carrinho.html" aria-label="Abrir carrinho"><i class="bi bi-bag"></i></a></div>
  <section class="contact-wrap">
    <div class="contact-box">
      <h1><i class="bi bi-envelope-paper me-2"></i>Contate-nos:</h1>
      <form id="contactForm" novalidate>
        <label for="nome"><i class="bi bi-person me-1"></i>Digite seu nome:</label>
        <input id="nome" type="text" autocomplete="name">

        <label for="email"><i class="bi bi-envelope me-1"></i>Digite seu email:</label>
        <input id="email" type="email" autocomplete="email">

        <label for="mensagem"><i class="bi bi-chat-left-text me-1"></i>Descreva o que deseja:</label>
        <textarea id="mensagem"></textarea>

        <button type="submit"><i class="bi bi-send me-2"></i>Enviar Formulário</button>
        <div id="feedback"></div>
      </form>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="site.js"></script>

<script>
const form = document.getElementById("contactForm");
const feedback = document.getElementById("feedback");

form.addEventListener("submit", function(event){
  event.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("email").value.trim();
  const mensagem = document.getElementById("mensagem").value.trim();

  const erros = [];

  if(nome.length < 3){
    erros.push("O nome precisa ter pelo menos 3 caracteres.");
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    erros.push("Digite um e-mail válido.");
  }

  if(mensagem.length < 10){
    erros.push("A mensagem precisa ter pelo menos 10 caracteres.");
  }

  if(erros.length > 0){
    feedback.style.color = "darkred";
    feedback.innerHTML = erros.join("<br>");
  }else{
    feedback.style.color = "green";
    feedback.textContent = "Formulário enviado com sucesso!";
    form.reset();
  }
});
</script>

</body>
</html>
